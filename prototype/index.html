function taskCriteria(task){
 if(Array.isArray(task.criteria))return task.criteria;
 const sample=seed.tasks.find(item=>item.id===task.id&&item.title===task.title&&item.operation===task.operation);
 return task.origin==='sample-ai'&&sample?sample.criteria:[];
}
function taskCompletion(task){
 const criteria=taskCriteria(task);if(!criteria.length)return null;
 let checked=0,acceptedWeight=0,totalWeight=0;
 for(const criterion of criteria){
  const rawWeight=Number(criterion?.weight??1),weight=Number.isFinite(rawWeight)&&rawWeight>0?rawWeight:1;
  totalWeight+=weight;
  if(criterion?.verified===true&&typeof criterion.evidence==='string'&&criterion.evidence.trim()){checked++;acceptedWeight+=weight}
 }
 return {criteria,checked,percent:Math.round(acceptedWeight/totalWeight*100)};
}

function openOrganization(department,expand=false){
 if(!state.departments.includes(department))return;
 const members=state.employees.filter(e=>e.department===department),managers=members.filter(e=>e.type==='manager'),workers=members.filter(e=>e.type==='worker');
 const branches=managers.map(manager=>{const reports=workers.filter(e=>e.manager===manager.id);return `<section class="org-chart-branch" data-manager-id="${esc(manager.id)}"><div class="org-chart-root">${employeeCard(manager)}</div><div class="org-chart-connector"></div><div class="org-chart-children">${reports.map(employeeCard).join('')||'<span class="muted tiny">직속 실무 AI 미등록</span>'}</div></section>`}).join('');
 const otherWorkers=workers.filter(e=>!managers.some(m=>m.id===e.manager));
 openDialog('조직도',`<div id="organization-chart"><div class="org-chart-top"><span class="org-chart-identity"><span class="org-list-icon">${icon('building')}</span><span><strong>${esc(department)}</strong><small>관리 AI ${managers.length}명 · 실무 AI ${workers.length}명</small></span></span>${btn(icon('plus')+' AI 직원 추가','org-add-employee',department,'primary')}</div><p class="muted tiny org-chart-tip">직원 카드에서 직속 관계와 호출 권한을 설정할 수 있습니다. 조직도의 연결선은 직속 관계만 나타냅니다.</p>${expand?`<div class="org-chart-jump"><span>조직도 아래에 배치 양식을 펼쳤습니다.</span>${btn('입력 양식으로 이동 ↓','org-scroll-assignment','','small soft')}</div>`:''}${members.length?`<div class="org-chart-layout">${branches}</div>${otherWorkers.length?`<section class="org-chart-other"><h3>직속 미설정·다른 조직에 보고하는 실무 AI</h3><div class="org-chart-children">${otherWorkers.map(employeeCard).join('')}</div></section>`:''}`:'<div class="empty org-chart-empty">아직 소속 직원이 없습니다. AI 직원 화면에서 생성한 AI를 ‘AI 직원 추가’에서 배치해 주세요.</div>'}${expand?organizationAssignmentPanel(department):''}<div class="notice gap">브라우저 안의 조직 설정 데모입니다. 실제 MCP 호출이나 Codex 세션 생성은 하지 않습니다.</div></div>`);
 document.getElementById('dialog').classList.add('org-chart-modal');if(expand)document.getElementById('dialog').classList.add('org-chart-expanded');
}

function saveOrganizationAssignment(form){
 const department=form.dataset.department,s=sessionById(document.getElementById('org-session-choice').value),e=s&&state.employees.find(e=>e.id===s.employeeId),error=document.getElementById('org-assign-error');
 if(!state.departments.includes(department)||!e||s.lifecycle!=='active'){error.textContent='유효한 조직과 현재 AI 세션을 선택해 주세요.';return}
 if(e.department){error.textContent='이 AI는 이미 조직에 배치되어 있습니다. 인사 이동에서 변경해 주세요.';return}

 if(manager&&!state.employees.some(m=>m.id===manager&&m.type==='manager'&&m.department===department)){error.textContent='같은 조직의 관리 AI를 선택해 주세요.';return}
 e.department=department;e.manager=manager;recordOrganization(e,'조직 배치',department+' · AI 세션 '+s.id+' · 호출 허용 없음');render();openOrganization(department,true);toast('AI를 조직에 배치했습니다. 호출 권한은 별도로 설정해 주세요.');
}

function saveOrganization(){
 const name=document.getElementById('organization-name').value.trim(),error=document.getElementById('organization-error');
 if(!name){error.textContent='조직명을 입력해 주세요.';return}
 if(name.length>40){error.textContent='조직명은 40자 이내로 입력해 주세요.';return}
 const comparison=value=>value.normalize('NFKC').trim().toLocaleLowerCase('ko-KR');
 if(state.departments.some(d=>comparison(d)===comparison(name))){error.textContent='같은 이름의 조직이 이미 있습니다. 다른 이름을 입력해 주세요.';return}
 state.departments.push(name);record('조직을 생성했습니다',name+' · 소속 직원 없음 · 세션 미생성','building');render();openOrganization(name);toast('조직을 생성했습니다. 조직도에서 AI 직원을 추가할 수 있습니다.');
}

function parseSkillMarkdown(raw){
 const content=raw.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n'),lines=content.split('\n');
 if(lines[0]!=='---')return {error:'SKILL.md 맨 앞에 ---와 name·description을 작성해 주세요.'};
 const end=lines.findIndex((line,index)=>index>0&&line==='---');
 if(end<0)return {error:'frontmatter의 끝을 나타내는 ---가 없습니다.'};
 const meta={};
 for(let i=1;i<end;i++){
  const match=lines[i].match(/^(name|description):\s*(.*)$/);
  if(!match)continue;
  const key=match[1];if(Object.hasOwn(meta,key))return {error:`${key} 이(가) 중복되었습니다.`};
  let value=match[2].trim();
  if(key==='description'&&/^[|>][-+]?$/.test(value)){
   const folded=value[0]==='>',block=[];
   while(i+1<end&&(lines[i+1].trim()===''||/^\s/.test(lines[i+1])))block.push(lines[++i]);
   const indent=Math.min(...block.filter(line=>line.trim()).map(line=>line.match(/^\s*/)[0].length));
   value=block.map(line=>line.slice(Number.isFinite(indent)?indent:0)).join(folded?' ':'\n').trim();
  }else if(value.startsWith('"')){
   try{value=JSON.parse(value)}catch{return {error:`${key} 의 따옴표를 확인해 주세요.`}}
  }else if(value.startsWith("'")){
   if(!value.endsWith("'"))return {error:`${key} 의 따옴표를 확인해 주세요.`};
   value=value.slice(1,-1).replace(/''/g,"'");
  }else value=value.replace(/\s+#.*$/,'').trim();
  meta[key]=value;
 }
 const name=meta.name||'',description=meta.description||'',body=lines.slice(end+1).join('\n').trim();
 if(!/^[a-z](?:[a-z0-9-]{0,62}[a-z0-9])?$/.test(name))return {error:'SKILL.md의 name은 영문 소문자로 시작하는 64자 이내의 영문 소문자·숫자·하이픈으로 작성해 주세요.'};
 if(!description||description.length>1024)return {error:'SKILL.md의 description을 1024자 이내로 작성해 주세요.'};
 if(!body)return {error:'SKILL.md 본문을 작성해 주세요.'};
 return {name,description,body,content};
}
async function loadSkillUpload(file){
 if(!file)return false;
 captureSkillForm();skillMode='upload';const revision=++skillUploadRevision,d=skillDrafts.upload;d.content='';d.fileName='';d.parsed=null;
 const error=message=>{if(view==='skills')render();const node=document.getElementById('skill-error');if(node)node.textContent=message;return false};
 if(!/\.(md|txt)$/i.test(file.name)||!Number.isFinite(file.size)||file.size<1||file.size>32768)return error('32 KiB 이하의 UTF-8 .md/.txt 파일을 선택해 주세요.');
 try{
  const content=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());
  if(revision!==skillUploadRevision)return false;
  if(!content.trim()||content.includes('\0'))return error('빈 파일이나 텍스트가 아닌 내용은 등록할 수 없습니다.');
  const parsed=parseSkillMarkdown(content);
  if(parsed.error)return error(parsed.error);
  d.content=parsed.content;d.fileName=file.name;d.parsed=parsed;
  if(view==='skills')render();return true;
 }catch{return revision===skillUploadRevision?error('UTF-8로 읽지 못했습니다. 파일을 확인해 주세요.'):false}
}

function saveModelPrices(){
 const next=defaultModelPrices(),error=document.getElementById('model-pricing-error');
 for(const [index,model] of models.entries())for(const field of ['input','cachedInput','output']){
  const input=document.getElementById(`price-${index}-${field}`),value=normalizeModelRate(input.value);
  if(value===null){error.textContent=`${model} 의 단가는 공란 또는 0 이상의 숫자로 입력해 주세요.`;input.focus();return}
  next[model][field]=value;
 }
 const previous=state.settings.modelPrices;
 state.settings.modelPrices=next;
 if(!save()){state.settings.modelPrices=previous;error.textContent='브라우저에 저장하지 못했습니다. 저장 공간을 확인해 주세요.';return}
 error.textContent='';toast('모델별 요금을 저장했습니다. 청구액 자동 계산은 하지 않습니다.');
}

function validManager(id){return id===''||state.employees.some(m=>m.id===id&&m.type==='manager')}
function saveEmployeeOrganization(id){
 const e=state.employees.find(e=>e.id===id);if(!e)return;
 const name=document.getElementById('org-employee-name').value.trim(),role=document.getElementById('org-employee-role').value.trim(),manager=e.type==='worker'?document.getElementById('org-employee-manager').value:'';
 if(!name||!role||!validManager(manager)){toast('이름·담당 업무·유효한 관리 AI를 확인해 주세요.');return}
 const previous=e.name+' / '+e.role,changedManager=e.manager!==manager,previousManager=state.employees.find(m=>m.id===e.manager)?.name||'미설정';
 if(name===e.name&&role===e.role&&!changedManager){toast('변경 사항이 없습니다.');return}
 const revoked=changedManager?revokeEmployeeCalls(e):0;e.name=name;e.role=role;e.manager=manager;e.initial=name.slice(0,2);
 recordOrganization(e,'조직 설정 변경',previous+' → '+name+' / '+role+(changedManager?' · 직속: '+previousManager+' → '+(state.employees.find(m=>m.id===manager)?.name||'미설정')+' · 호출 허용 '+revoked+'건 해제':''));render();openEmployee(id);toast(changedManager?'보고 대상을 변경했습니다. 호출 권한을 다시 설정해 주세요.':'조직 설정을 저장했습니다. 세션 설정은 변경하지 않습니다.');
}
function saveManagerPermissions(id,form){
 const e=state.employees.find(e=>e.id===id&&e.type==='manager');if(!e)return;
 const requested=[...new Set(new FormData(form).getAll('callable-worker'))];if(requested.some(id=>!state.employees.some(w=>w.id===id&&w.type==='worker'&&state.departments.includes(w.department)))){toast('호출 대상으로 등록된 실무 AI만 선택해 주세요.');return}
 const previous=[...e.callableWorkerIds],names=ids=>ids.map(id=>state.employees.find(w=>w.id===id)?.name||id).join(', ')||'없음';
 e.callableWorkerIds=requested;recordOrganization(e,'호출 권한 변경',names(previous)+' → '+names(requested));render();openEmployee(id,'permissions');toast('호출 권한을 저장했습니다. 실제 MCP 호출이나 실행은 하지 않습니다.');
}
function saveTransfer(id){
 const e=state.employees.find(e=>e.id===id);if(!e)return;
 const from=e.department,to=document.getElementById('transfer-department').value,manager=e.type==='worker'?document.getElementById('transfer-manager').value:'';
 if(!state.departments.includes(to)||!validManager(manager)){toast('유효한 소속과 관리 AI를 선택해 주세요.');return}
 if(from===to&&e.manager===manager){toast('현재와 다른 소속 또는 직속 관리 AI를 선택해 주세요.');return}
 const previousManager=state.employees.find(m=>m.id===e.manager)?.name||'미설정',revoked=revokeEmployeeCalls(e);e.department=to;e.manager=manager;
 const entry=e.name+' · '+from+' → '+to+(e.type==='worker'?' · 직속: '+previousManager+' → '+(state.employees.find(m=>m.id===manager)?.name||'미설정'):'')+' · '+(document.getElementById('transfer-reason').value.trim()||'이유 없음')+' · 호출 허용 '+revoked+'건 해제';
 state.transfers.unshift(entry);recordOrganization(e,'인사 이동',entry);closeDialog();render();toast('인사 이동을 반영했습니다. 호출 권한은 다시 설정해야 합니다. 세션과 이력은 유지됩니다.');
}

function saveWorkOrder(){
 const title=document.getElementById('work-order-title').value.trim(),managerId=document.getElementById('work-order-manager').value,instruction=document.getElementById('work-order-instruction').value.trim(),criteria=document.getElementById('work-order-criteria').value.trim(),error=document.getElementById('work-order-error');
 if(!title||title.length>100){error.textContent='지시 제목을 100자 이내로 입력해 주세요.';return}
 if(!state.employees.some(e=>e.id===managerId&&e.type==='manager'&&defaultSessionFor(e.id))){error.textContent='현재 세션이 있는 관리 AI를 선택해 주세요.';return}
 if(!instruction||instruction.length>2000||!criteria||criteria.length>2000){error.textContent='의뢰 내용과 결과 보고 확인 항목을 각각 2000자 이내로 입력해 주세요.';return}
 let number=Math.max(1000,...state.workOrders.map(order=>Number(order.id.match(/\d+$/)?.[0])||0))+1;
 while(state.workOrders.some(order=>order.id==='ORDER-'+number))number++;
 const order={id:'ORDER-'+number,title,managerId,status:'queued',instruction,criteria,createdAt:sessionTimestamp(),taskIds:[],report:null,origin:'created'};
 state.workOrders.unshift(order);
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch{state.workOrders.shift();error.textContent='브라우저에 저장하지 못했습니다. 저장 공간을 확인하고 다시 시도해 주세요.';return}
 workOrderTab='orders';closeDialog();render();toast('업무 지시를 저장했습니다. 실제 관리 AI는 시작되지 않았습니다.');
}
function setWorkOrderStatus(id,status){
 const order=state.workOrders.find(item=>item.id===id);
 if(!order||!(order.status==='queued'&&status==='paused'||order.status==='paused'&&status==='queued'))return false;
 const previous=order.status;order.status=status;
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch{order.status=previous;toast('브라우저에 저장하지 못했습니다.');return false}
 closeDialog();render();toast(status==='paused'?'업무 지시를 보류했습니다 · 데모':'업무 지시를 접수 대기로 돌렸습니다 · 데모');return true;
}

function openTask(id){
 const task=state.tasks.find(item=>item.id===id);if(!task)return;
 const worker=employee(task.owner),manager=employee(task.manager),logs=state.workLogs.filter(item=>item.taskId===id),order=state.workOrders.find(item=>item.taskIds.includes(id));
 const process=state.workProcesses.find(item=>item.id===task.workId||(Array.isArray(item.taskIds)&&item.taskIds.includes(id)));
 const completion=taskCompletion(task);
 const criteriaDetails=completion?`<p class="criteria-intro">근거가 있는 확인 완료 조건 ${completion.checked}/${completion.criteria.length} · ${completion.percent}%(가중치 적용, 샘플은 동일 가중치). Task 수나 이전 진행 값으로 계산하지 않습니다.</p><ul class="criteria-list">${completion.criteria.map(criterion=>{const verified=criterion?.verified===true&&typeof criterion.evidence==='string'&&criterion.evidence.trim();return `<li><div class="between wrap"><strong>${esc(criterion?.name||'이름 미설정')}</strong><span class="badge ${verified?'green':''}">${verified?'확인 완료 · 데모':'미확인'}</span></div><small>확인 근거: ${verified?esc(criterion.evidence):'미기록'}</small></li>`}).join('')}</ul>`:'<div class="notice amber">완료 조건과 근거가 설정되지 않아 진행률을 계산하지 않습니다.</div>';
 const logRecords=logs.map(item=>`<div class="audit-row">${icon('folder')}<div><strong>${esc(item.id)} · ${esc(state.employees.find(e=>e.id===item.employeeId)?.name||'직원 미등록')}</strong><p>${esc(item.summary)}</p><button class="link-btn" data-action="work-log" data-id="${esc(item.id)}">일지 열기 ${icon('arrow')}</button></div><time>${esc(item.at)}</time></div>`).join('')||'<p class="muted tiny">관련 업무 일지가 없습니다.</p>';
 openDialog('Task 기록',`<div class="between wrap"><span class="mono muted">${esc(task.id)}</span>${badge(task.status)}</div><h2 style="font-size:18px;margin-top:12px">${esc(task.title)}</h2><p class="muted" style="font-size:12px;margin-top:11px">${esc(task.description||'업무 내용이 기록되지 않았습니다.')}</p><p class="muted tiny gap">${task.origin==='legacy-unverified'?'이전 데모 · 기록 출처 미확인':'AI 업무 샘플 기록'}</p><div class="task-flow"><div class="flow-node">${avatar(manager,'small')}<strong>${esc(manager.name)}</strong><div>관리 AI</div></div>${icon('arrow')}<div class="flow-node">${icon('database')}<div style="margin-top:6px">System MCP</div><small>Task 의뢰</small></div>${icon('arrow')}<div class="flow-node">${avatar(worker,'small')}<strong>${esc(worker.name)}</strong><div>담당 AI</div></div></div><div class="detail-info"><div class="detail-item">OPERATION<strong class="mono">${esc(task.operation)}</strong></div><div class="detail-item">완료 조건<strong>${completion?`${completion.checked}/${completion.criteria.length} · ${completion.percent}%`:'기준 미설정'}</strong></div></div>${process?`<p class="muted tiny gap">지속 업무: ${esc(process.name)} · 이 Task의 완료율은 지속 업무 전체의 진행률이 아닙니다.</p>`:''}<div class="work-order-detail-section"><h3>완료 조건과 확인 근거</h3>${criteriaDetails}</div><div class="work-order-detail-section"><h3>관련 업무 일지 · 담당 AI의 진행 메모</h3><div class="audit-list" style="padding:0">${logRecords}</div></div><div class="form-actions">${process?btn('지속 업무 실행 이력','work-process',process.id,'small soft'):''}${order?btn('원래 업무 지시 보기','work-order',order.id,'small soft'):''}${btn('업무 일지 목록','navigate','work-logs','small soft')}${btn('담당 AI 보기','employee',worker.id,'small soft')}</div>`);
}
function editSchedule(id){const s=state.schedules[id];openDialog(`${esc(employee(id).name)}의 일정`, `<form id="schedule-form" data-id="${esc(id)}"><label class="field">cron 식<input id="schedule-cron" type="text" value="${esc(s.cron)}" required maxlength="100"><small>5필드 형식만 확인하는 데모입니다. 실행 일시는 계산하지 않습니다.</small></label><label class="field gap">기본 프롬프트<textarea id="schedule-prompt" rows="7" maxlength="3000" required>${esc(s.prompt)}</textarea></label><div class="notice gap">시간대 · Asia/Seoul / 실제 예약 등록 없음</div><div class="form-actions">${btn('취소','close-dialog')}<button class="btn primary" type="submit">일정 저장</button></div></form>`)}
// 사용자 입력은 항상 이스케이프하며 외부 API나 셸에 전달하지 않는다.
document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav){requestEditorNavigation(nav.dataset.nav);return}const el=event.target.closest('[data-action]');if(!el)return;const {action,id,tab}=el.dataset;switch(action){case 'navigate':requestEditorNavigation(id);break;case 'close-menu':closeMenu();break;case 'close-dialog':closeDialog();break;case 'create-organization':addOrganization();break;case 'open-organization':openOrganization(id);break;case 'org-add-employee':openOrganization(id,true);break;case 'org-close-assignment':openOrganization(id);break;case 'org-scroll-assignment':document.getElementById('org-assignment-panel')?.scrollIntoView({block:'start',behavior:'smooth'});break;case 'org-scroll-chart':document.querySelector('#organization-chart .org-chart-top')?.scrollIntoView({block:'start',behavior:'smooth'});break;case 'create-unassigned-ai-session':startSessionEditor('__new__','',id);break;case 'employee':openEmployee(id);break;case 'employee-tab':openEmployee(id,tab);break;case 'transfer':transfer(id);break;case 'open-session':{const session=resolveSession(id);if(session){selectedSession=session.id;closeDialog();navigate('sessions')}else toast('현재 세션을 찾을 수 없습니다.');break}case 'create-ai':startSessionEditor('__new__');break;case 'edit-session':startSessionEditor('',id);break;case 'cancel-session-editor':requestEditorNavigation(sessionDraft?.returnDepartment?'organization':'ai-sessions');break;case 'open-skill-registration':requestEditorNavigation('skills');break;case 'open-persona-registration':requestEditorNavigation('persona-templates');break;case 'confirm-editor-leave':confirmEditorLeave(id);break;case 'skill-mode':switchSkillMode(id);break;case 'session-use-defaults':{captureSessionDraft();const defaults=roleSessionDefaults(sessionDraft.employeeId==='__new__'?{type:sessionDraft.newAiType}:employee(sessionDraft.employeeId));sessionDraft.model=defaults.model;sessionDraft.persona=defaults.persona;sessionDraft.skills=[...defaults.skills];sessionDraft.template='role';render();toast('역할 템플릿을 초안에 복사했습니다. 조직 설정은 변경하지 않습니다.');break}case 'open-interview':selectedInterview=id;closeDialog();navigate('interviews');break;case 'select-session':if(view==='interviews')selectedInterview=id;else selectedSession=resolveSession(id)?.id||selectedSession;render();break;case 'task':openTask(id);break;case 'work-process':openWorkProcess(id);break;case 'create-work-order':openWorkOrderForm();break;case 'interview-work-order':{const person=employee(selectedInterview),managerId=person.type==='manager'?person.id:person.manager;navigate('work-orders');openWorkOrderForm('1:1 합의 사항 후속 조치',managerId);break}case 'work-order-tab':if(['orders','reports'].includes(id)){workOrderTab=id;render()}break;case 'work-order':openWorkOrder(id);break;case 'pause-work-order':setWorkOrderStatus(id,'paused');break;case 'resume-work-order':setWorkOrderStatus(id,'queued');break;case 'work-log':openWorkLog(id);break;case 'task-filter':taskFilter=id;render();break;case 'edit-schedule':editSchedule(id);break;case 'wake-manager':{const e=employee(id);record(`${e.name}의 시작을 시뮬레이션했습니다`,'WakeEvent · Task 추가 없음 · 실제 실행 없음','play');render();toast('시작 이벤트만 시뮬레이션했습니다. Task는 추가하지 않습니다.');break}case 'advance-cooldown':state.recovery.elapsed=true;save();render();toast('가상 시계에서 60초가 지났습니다.');break;case 'resume-demo':if(state.recovery.elapsed&&!state.recovery.resumed){state.recovery.resumed=true;const t=state.tasks.find(t=>t.id==='TASK-1041');t.status='running';employee('w2').status='running';record('Atlas의 재개를 시뮬레이션했습니다','TASK-1041 · 동일 Operation · 샘플 attempt 2','refresh');render();toast('재개 완료 · 같은 Task의 샘플 상태만 변경했습니다.')}break;case 'notifications':openDialog('작업 공간 알림',`<div class="audit-list" style="padding:0">${state.activity.slice(0,8).map(a=>`<div class="audit-row">${icon(a.icon)}<div><strong>${esc(a.title)}</strong><p>${esc(a.detail)}</p></div><time>${esc(a.time)}</time></div>`).join('')}</div>`);break;case 'diagnostics':openDialog('환경 진단 예시',`<div class="notice amber">실제 경로·CLI·인증 상태는 검사하지 않습니다.</div><div class="setting-row"><div><h3>Codex CLI</h3><p>프로세스 실행 미연결</p></div><span class="badge">미검증</span></div><div class="setting-row"><div><h3>로그 읽기</h3><p>파일 접근 없음</p></div><span class="badge">미검증</span></div><div class="setting-row"><div><h3>DB / System MCP</h3><p>로컬 샘플 데이터로 대체</p></div><span class="badge">데모</span></div>`);break;case 'reset-demo':openDialog('데모 변경 초기화',`<p class="muted" style="font-size:12px">이 프로토타입에서 추가한 AI 직원·업무 지시·Task·지속 업무·업무 일지·대화·설정을 샘플 상태로 되돌립니다. 다른 파일이나 브라우저 데이터는 바꾸지 않습니다.</p><div class="form-actions">${btn('취소','close-dialog')}${btn('샘플로 되돌리기','confirm-reset','','danger')}</div>`);break;case 'confirm-reset':state=hydrateSessions(structuredClone(seed));selectedSession='session-demo-w1';sessionDraft=null;skillMode='direct';skillDrafts={direct:{name:'',description:'',body:''},upload:{content:'',fileName:'',parsed:null}};skillUploadRevision++;sessionEmployeeFilter='all';selectedInterview='m1';taskFilter='all';taskQuery='';workOrderTab='orders';workLogEmployeeFilter='all';workLogTaskFilter='all';save();closeDialog();render();toast('데모 데이터를 초기화했습니다.');break;}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.schedule){const id=el.dataset.schedule;state.schedules[id].enabled=el.checked;record(`${employee(id).name} 일정 ${el.checked?'활성':'중지'}`,'브라우저 데모 설정 · 실제 예약 없음','clock');render();toast('데모 일정 설정을 반영했습니다.')}});
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target,fd=new FormData(form);switch(form.id){case 'session-form':saveSessionForm();break;case 'skill-form':saveSkillRegistration(form.dataset.mode);break;case 'persona-template-form':savePersonaTemplate();break;case 'organization-form':saveOrganization();break;case 'org-assignment-form':saveOrganizationAssignment(form);break;case 'employee-organization-form':saveEmployeeOrganization(form.dataset.id);break;case 'manager-permissions-form':saveManagerPermissions(form.dataset.id,form);break;case 'transfer-form':saveTransfer(form.dataset.id);break;case 'work-order-form':saveWorkOrder();break;case 'task-search':taskQuery=document.getElementById('task-query').value.trim();render();break;case 'global-search':{const q=document.getElementById('global-query').value.trim();if(!q)return;const hit=state.employees.find(e=>`${e.name} ${e.role}`.toLowerCase().includes(q.toLowerCase()));if(hit){if(hit.department){navigate('organization');openOrganization(hit.department)}else{sessionEmployeeFilter=hit.id;navigate('ai-sessions')}}else{taskQuery=q;taskFilter='all';navigate('tasks')}break}case 'chat-form':{const input=document.getElementById('chat-message'),text=input.value.trim();if(!text)return;const interview=view==='interviews',session=interview?null:sessionById(selectedSession),owner=interview?selectedInterview:session?.employeeId;if(!owner)return;if(!interview&&session.lifecycle!=='active'){toast('이전 세션에는 메시지를 보낼 수 없습니다.');return}const id=interview?owner:session.messageKey,e=employee(owner),store=interview?state.interviews:state.messages;if(!store[id])store[id]=getMessages(owner,interview,session?.id).map(m=>({...m}));store[id].push({role:'user',text,time:'방금'});store[id].push({role:'ai',text:interview?'데모 응답입니다. 면담 이력에 메시지를 추가했습니다.\n합의한 업무는 ‘업무 지시’에서 관리 AI에게 의뢰할 수 있습니다.':'데모 응답입니다. 이 세션에 메시지를 기록했습니다.\n설정 모델: '+session.model+' / 설정 v'+session.version+'\n실제 AI 추론이나 도구 실행은 하지 않습니다.',time:'방금',demo:true});if(interview)record(`${e.name}와 면담을 계속했습니다`,'1:1 전용 이력 · 비공유','chat');else save();render();document.getElementById('chat-thread').scrollTop=999999;document.getElementById('chat-message').focus();break}case 'schedule-form':{const cron=document.getElementById('schedule-cron').value.trim();if(cron.split(/\s+/).length!==5||!/^[\d*\/\-,\s]+$/.test(cron)){toast('숫자·*·/·-·쉼표로 구성된 5개 필드를 입력해 주세요.');return}state.schedules[form.dataset.id].cron=cron;state.schedules[form.dataset.id].prompt=document.getElementById('schedule-prompt').value;record(`${employee(form.dataset.id).name}의 기본 업무를 갱신했습니다`,'cron 형식 · 프롬프트 · 샘플 설정','clock');closeDialog();render();toast('일정을 저장했습니다 · 실제 cron 등록은 하지 않습니다');break}case 'model-pricing-form':saveModelPrices();break;case 'environment-form':{state.settings={...state.settings,logPath:document.getElementById('log-path').value,home:document.getElementById('codex-home').value,concurrency:document.getElementById('concurrency').value,retry:document.getElementById('retry-limit').value};if(save())toast('환경 설정을 저장했습니다 · 이 브라우저에만 반영됩니다.');break}}});

document.addEventListener('change',event=>{const el=event.target;if(el.id==='skill-upload-file'){loadSkillUpload(el.files?.[0]);return}if(el.id==='org-session-choice')updateOrganizationAssignmentPreview();if(el.matches('#manager-permissions-form input[name="callable-worker"]')){document.getElementById('permission-count').textContent=document.querySelectorAll('#manager-permissions-form input[name="callable-worker"]:checked').length+'명 선택';}});
document.addEventListener('input',event=>{if(event.target.closest('#session-form')){if(event.target.id==='session-persona')document.getElementById('session-persona-template').value='custom';captureSessionDraft();updateSessionPreview();}if(event.target.closest('#skill-form')){captureSkillForm();updateSkillPreview();}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='work-log-employee-filter'){workLogEmployeeFilter=el.value;workLogTaskFilter='all';render();return}if(el.id==='work-log-task-filter'){workLogTaskFilter=el.value;render();return}if(el.id==='session-employee-filter'){sessionEmployeeFilter=el.value;render();return}if(el.closest('#session-form')){if(el.id==='new-ai-type'){captureSessionDraft();const defaults=roleSessionDefaults(sessionDraft.employeeId==='__new__'?{type:sessionDraft.newAiType}:employee(sessionDraft.employeeId));sessionDraft.model=defaults.model;sessionDraft.persona=defaults.persona;sessionDraft.skills=[...defaults.skills];sessionDraft.template='role';render();return}if(el.id==='session-persona-template'){const type=sessionDraft.employeeId==='__new__'?sessionDraft.newAiType:employee(sessionDraft.employeeId).type,content=personaTemplateText(el.value,type);if(content!==null)document.getElementById('session-persona').value=content;}captureSessionDraft();updateSessionPreview();}});

document.getElementById('menu-toggle').addEventListener('click',()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebar-overlay').classList.toggle('open',open);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open))});
document.getElementById('sidebar-overlay').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('#organization-table tr[data-action]')){e.preventDefault();openOrganization(e.target.dataset.id)}if(e.key==='Escape')closeMenu()});
document.getElementById('dialog').addEventListener('click',e=>{if(e.target===document.getElementById('dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
window.addEventListener('beforeunload',event=>{if(view!=='session-editor'||!sessionDraft)return;captureSessionDraft();if(sessionDraftSnapshot(sessionDraft)!==sessionDraft.initialSnapshot){event.preventDefault();event.returnValue='';}});
document.getElementById('search-icon').innerHTML=icon('search');document.getElementById('notification-icon').innerHTML=icon('bell');
render();
</script>
